name: Generar Reporte Automatico

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar el reporte PDF
        run: python src/06_generate_report.py

      - name: Commitear el reporte generado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: reporte automatico generado por GitHub Actions"
          file_pattern: reports/*.pdf
